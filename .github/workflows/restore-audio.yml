name: Restore original Frontier Mountain v0.6.1 audio
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-audio.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install audio transcoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Convert original audio to Godot-supported Ogg Vorbis
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          command -v ffmpeg
          for name in axe-chop wood-buck log-lift log-drop mill-load mill-cut tree-fall chainsaw-rev; do
            curl --fail --location --retry 4 --retry-delay 3 --max-time 180 \
              "https://frontier-mountain-media.onrender.com/${name}.m4a" \
              -o "/tmp/${name}.m4a"
            ffmpeg -y -hide_banner -loglevel error -i "/tmp/${name}.m4a" \
              -vn -ac 1 -ar 32000 -c:a libvorbis -q:a 4 "assets/audio/${name}.ogg"
            test -s "assets/audio/${name}.ogg"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "assets/audio/${name}.ogg"
            echo "RESTORED: ${name}"
          done
          curl --fail --location --retry 4 --retry-delay 3 --max-time 240 \
            "https://frontier-mountain-sound.onrender.com/old-growth-stillness.m4a" \
            -o /tmp/old-growth-stillness.m4a
          ffmpeg -y -hide_banner -loglevel error -i /tmp/old-growth-stillness.m4a \
            -vn -c:a libvorbis -q:a 4 assets/audio/old-growth-stillness.ogg
          test -s assets/audio/old-growth-stillness.ogg
          echo "RESTORED: Old Growth Stillness music"
      - name: Commit original audio assets
        run: |
          git config user.name "frontier-game-ci"
          git config user.email "frontier-game-ci@users.noreply.github.com"
          git add assets/audio/*.ogg
          if ! git diff --cached --quiet; then
            git commit -m "Import original v0.6.1 music and sampled SFX for Godot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
